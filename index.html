<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wer ist es?</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --accent-basic: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --accent-custom: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
      --accent-green: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      --accent-danger: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --border-color: #e2e8f0;
      --shadow-soft: 0 10px 25px rgba(0,0,0,0.05);
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Nunito', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      padding-bottom: 20px;
    }

    .hide-in-game { display: block; }

    #btn-fullscreen {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.5rem 1rem;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      border-radius: 12px;
      cursor: pointer;
      z-index: 100;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s;
    }
    #btn-fullscreen:active { transform: scale(0.9); }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      color: #2d3748;
      margin: 2rem 0 1.5rem 0;
      letter-spacing: -1px;
    }

    h2, h3 { color: #4a5568; font-weight: 700; }

    button {
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      margin: 0.5rem;
    }

    button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-basic { background: var(--accent-basic); }
    .btn-custom { background: var(--accent-custom); }
    .btn-action { background: var(--accent-green); width: 100%; max-width: 320px; margin: 1rem 0; color: #0a4d2e; }
    .btn-danger { background: var(--accent-danger); font-size: 0.9rem; padding: 0.5rem 1rem; margin: 0; box-shadow: none;}

    input {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: var(--text-main);
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 14px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 1rem;
      outline: none;
      box-sizing: border-box;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4facfe; }

    .view { display: none; animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); flex-direction: column; padding: 10px; }
    .active-view { display: flex; }
    
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .setup-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.5);
      margin: 0 auto;
      width: 90%;
      max-width: 500px;
      box-shadow: var(--shadow-soft);
    }

    #custom-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 1.5rem; }

    /* Sticky Header - Bleibt beim Scrollen oben */
    #game-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      height: 110px; 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border-color);
      padding: 0 15px; 
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
    }

    #status-bar { font-size: 0.95rem; font-weight: 800; color: var(--text-muted); text-align: left; flex: 1; }

    #opponent-target-display {
      display: none; align-items: center; gap: 10px; background: rgba(67, 233, 123, 0.15);
      border: 2px solid #43e97b; border-radius: 12px; padding: 6px 12px; height: 80px;
    }
    
    #opponent-target-display p { margin: 0; color: #0a4d2e; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; }
    #opponent-target-content { display: flex; align-items: center; gap: 10px; height: 100%; }
    
    #opponent-target-content img { 
      height: 100%; aspect-ratio: 4 / 5; object-fit: cover; 
      border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    #opponent-target-content span { font-size: 0.9rem; font-weight: 800; color: var(--text-main);}

    /* Dynamisches Grid & Aspect Ratio Fix */
    #board { 
      display: grid; 
      gap: 10px; 
      padding: 15px; 
      box-sizing: border-box; 
    }

    @media (orientation: portrait) { #board { grid-template-columns: repeat(4, 1fr); } }
    @media (orientation: landscape) { #board { grid-template-columns: repeat(6, 1fr); } }

    .card {
      background-color: var(--card-bg); 
      border: none; 
      border-radius: 14px;
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      align-items: center;
      justify-content: space-between; 
      overflow: hidden; 
      position: relative; 
      width: 100%; 
      aspect-ratio: 4 / 5; /* Zwingt die Karte ins Format */
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    }
    .card:active { transform: scale(0.92); }

    .card img { width: 100%; height: 75%; object-fit: cover; border-bottom: 1px solid var(--border-color); }
    .card span { 
      height: 25%; width: 100%; display: flex; align-items: center; justify-content: center; 
      font-weight: 800; font-size: 0.8rem; color: var(--text-main); box-sizing: border-box; 
      padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }
    
    .card.custom-unselected { opacity: 0.4; filter: grayscale(100%); box-shadow: none; }
    .card.custom-selected { border: 3px solid #43e97b; }
    .card.custom-selected::after {
      content: '✔'; position: absolute; top: 6px; right: 6px; background: #43e97b; color: #fff;
      border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center;
      justify-content: center; font-weight: 900; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* Abgewählt im Spiel */
    .eliminated { opacity: 0.25; filter: grayscale(100%); transform: scale(0.95); }
    .selected-target { border: 4px solid #43e97b !important; box-shadow: 0 0 20px rgba(67, 233, 123, 0.6); pointer-events: none; }

    #win-screen {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 999; flex-direction: column;
      align-items: center; justify-content: center; animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #win-screen h1 { font-size: 4rem; color: #ff0844; margin-bottom: 0.5rem; background: var(--accent-custom); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    #win-screen h2 { font-size: 2rem; color: var(--text-main); margin-bottom: 2rem; }
    
    .player-list-item { background: #fff; margin: 8px auto; padding: 12px 16px; border-radius: 12px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border-color);}
    .lobby-info { display: flex; flex-direction: column; align-items: flex-start; }
    .lobby-title { font-size: 1.15rem; color: var(--text-main); }
    .lobby-host { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; }

    /* PC Optimierung */
    @media (min-width: 800px) {
      .container {
        max-width: 1200px; 
        margin: 2rem auto; 
        min-height: auto;
        border-radius: 24px; 
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        border: 1px solid var(--border-color); 
        overflow: hidden;
      }
      .card span { font-size: 1rem; }
      #board { grid-template-columns: repeat(5, 1fr); padding: 25px; gap: 20px;}
      #game-header { height: 140px; border-radius: 24px 24px 0 0; padding: 0 25px;}
      #opponent-target-content img { height: 100px; width: auto; }
    }
  </style>
</head>
<body>
  <button id="btn-fullscreen" class="hide-in-game">Vollbild</button>
  
  <div class="container">
    <h1 class="hide-in-game" id="main-title">Wer ist es? ✌️</h1>

    <!-- 1. Modus Auswahl -->
    <div id="view-mode-select" class="view active-view">
      <div class="setup-card">
        <h2 style="margin-top:0;">Spielmodus wählen</h2>
        <button class="btn-basic" onclick="selectMode('basic')" style="width: 100%;">Basic Modus</button>
        <button class="btn-custom" onclick="selectMode('custom')" style="width: 100%;">Custom Modus</button>
      </div>
    </div>

    <!-- 2. Setup -->
    <div id="view-setup" class="view">
      <div class="setup-card">
        <h2 id="setup-title" style="margin-top:0;">Wer bist du?</h2>
        <input type="text" id="player-name" placeholder="Dein Name" autocomplete="off" />
        
        <div id="custom-selection-container" style="display:none; margin-top: 1rem;">
          <p style="color: var(--text-muted); font-size: 0.9rem; font-weight:700; margin:0;">Wähle bekannte Personen:</p>
          <div id="custom-grid"></div>
        </div>

        <button class="btn-action" id="btn-go-to-lobbies">Weiter zur Lobby</button>
      </div>
    </div>

    <!-- 3. Lobby Liste -->
    <div id="view-lobby-list" class="view">
      <div class="setup-card" style="max-width: 600px;">
        <h2 style="margin-top:0;">Offene Spiele 🎮</h2>
        
        <div style="margin-bottom: 25px; border-bottom: 2px dashed var(--border-color); padding-bottom: 25px;">
          <input type="text" id="new-room-name" placeholder="Name für neue Lobby..." style="margin-bottom: 10px;" />
          <button class="btn-basic" id="btn-create-room" style="width: 100%; margin: 0;">Lobby erstellen</button>
        </div>
        
        <ul id="active-lobbies-list" style="list-style: none; padding: 0; margin: 0;"></ul>
      </div>
    </div>

    <!-- 4. Wartebereich -->
    <div id="view-lobby" class="view">
      <div class="setup-card">
        <h2 id="current-room-title" style="margin-top:0;">Raum</h2>
        <div id="lobby-status" style="margin-bottom: 15px; color: var(--text-muted); font-weight: 700;">Warte auf Mitspieler...</div>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
        <button class="btn-action" id="btn-start-multiplayer" style="display:none;">Spiel starten 🚀</button>
      </div>
    </div>

    <!-- 5. Das Spiel (Board mit eigenem Scrolling durch den Body) -->
    <div id="view-game" class="view" style="padding:0;">
      <div id="game-header">
        <div id="status-bar">Warte auf Zuweisung...</div>
        <div id="opponent-target-display">
          <div><p id="target-player-name">Gegner sucht:</p></div>
          <div id="opponent-target-content"></div>
        </div>
      </div>
      <div id="board"></div>
    </div>
  </div>

  <div id="win-screen">
    <h1>GEWONNEN! 🎉</h1>
    <h2 id="winner-name-display"></h2>
    <button id="btn-restart" class="btn-basic" style="display:none;">Neue Runde starten</button>
  </div>

  <script>
    const pusher = new Pusher('3df7da082bcfbaaacad9', { cluster: 'eu', authEndpoint: '/api/auth' });
    let channel = null; 
    
    const SUPABASE_URL = 'https://vqqtiskjqyemzhelmqki.supabase.co';
    // TRAGE HIER DEINEN RICHTIGEN KEY EIN:
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxcXRpc2tqcXllbXpoZWxtcWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzkyNjQsImV4cCI6MjEwMTY1NTI2NH0.-bofHdro5SOiXVioD4eJkSl69_qiMj2ExCCnhb0TKSQ'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = '';
    let isAdmin = false; 
    let currentRoom = '';
    let selectedMode = ''; 
    let myPool = [];
    let allBasicFiles = [];

    let players = [];
    let isHost = false;
    let myAssignment = null; 
    let cardIGuess = null;     
    let cardToDefend = null;   
    let selectionsReady = 0;
    let gamePhase = 'waiting';

    // Logik für Bildnamen (anna_1 -> Anna)
    function getBaseName(filename) {
      let name = filename.split('/').pop().split('.')[0];
      return name.replace(/_\d+$/, ''); 
    }

    function getDisplayName(filename) {
      let name = getBaseName(filename);
      return name.charAt(0).toUpperCase() + name.slice(1);
    }

    function forceFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().then(() => {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {}); 
              }
            }).catch(() => {});
          } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
        }
      } catch (e) {
        console.log("Vollbild blockiert.");
      }
    }

    document.getElementById('btn-fullscreen').addEventListener('click', forceFullscreen);

    function toggleGameUI(inGame) {
      const elementsToHide = document.querySelectorAll('.hide-in-game');
      elementsToHide.forEach(el => el.style.display = inGame ? 'none' : 'block');
    }

    fetch('/api/getImages')
      .then(res => res.json())
      .then(files => {
        if (files.error) return;
        allBasicFiles = files.map(file => `Bilder/${file}`);
      });

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
      document.getElementById(viewId).classList.add('active-view');
      toggleGameUI(viewId === 'view-game');
      if (viewId === 'view-game') window.scrollTo(0, 0); // Scrollt zum Start nach oben
    }

    window.selectMode = function(mode) {
      selectedMode = mode;
      document.getElementById('custom-selection-container').style.display = mode === 'custom' ? 'block' : 'none';
      switchView('view-setup');
    };

    document.getElementById('player-name').addEventListener('change', (e) => {
      const name = e.target.value.trim();
      if (selectedMode === 'custom' && name) {
        loadUserCustomSelection(name);
      }
    });

    async function loadUserCustomSelection(name) {
      const { data, error } = await supabaseClient.from('user_selections').select('selected_images').eq('player_name', name).single();
      const selectedSet = data ? data.selected_images : [...allBasicFiles];
      const grid = document.getElementById('custom-grid');
      grid.innerHTML = '';

      allBasicFiles.forEach(file => {
        const div = document.createElement('div');
        div.className = 'card';
        if (selectedSet.includes(file)) div.classList.add('custom-selected');
        else div.classList.add('custom-unselected');

        div.innerHTML = getCardHTML(file);
        div.addEventListener('click', () => {
          div.classList.toggle('custom-selected');
          div.classList.toggle('custom-unselected');
        });
        grid.appendChild(div);
      });
    }

    async function saveUserCustomSelection(name) {
      const gridCards = document.querySelectorAll('#custom-grid .card');
      const selectedFiles = [];
      gridCards.forEach((card, index) => {
        if (card.classList.contains('custom-selected')) selectedFiles.push(allBasicFiles[index]);
      });
      await supabaseClient.from('user_selections').upsert({ player_name: name, selected_images: selectedFiles });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function generatePool(mode) {
      let sourceFiles = [];
      
      if (mode === 'basic') {
        sourceFiles = [...allBasicFiles];
      } else {
        const { data } = await supabaseClient.from('user_selections').select('selected_images').eq('player_name', myName).single();
        sourceFiles = data ? data.selected_images : [...allBasicFiles];
      }

      const grouped = {};
      sourceFiles.forEach(file => {
        const base = getBaseName(file);
        if (!grouped[base]) grouped[base] = [];
        grouped[base].push(file);
      });

      let uniqueNames = Object.keys(grouped);
      shuffleArray(uniqueNames);
      
      if (uniqueNames.length < 20) {
          const basicGrouped = {};
          allBasicFiles.forEach(file => {
              const base = getBaseName(file);
              if (!basicGrouped[base]) basicGrouped[base] = [];
              basicGrouped[base].push(file);
          });
          const remainingNames = Object.keys(basicGrouped).filter(n => !uniqueNames.includes(n));
          shuffleArray(remainingNames);
          
          uniqueNames.forEach(n => { if(!grouped[n]) grouped[n] = basicGrouped[n]; });
          remainingNames.forEach(n => { grouped[n] = basicGrouped[n]; });
          
          uniqueNames = [...uniqueNames, ...remainingNames].slice(0, 20);
      } else {
          uniqueNames = uniqueNames.slice(0, 20);
      }

      const finalPool = uniqueNames.map(name => {
        const images = grouped[name];
        return images[Math.floor(Math.random() * images.length)];
      });

      return finalPool;
    }

    function getCardHTML(item) {
      if (item.toLowerCase().match(/\.(jpg|jpeg|png)$/)) {
        const displayName = getDisplayName(item);
        return `<img src="${item}" alt="${displayName}"><span>${displayName}</span>`;
      }
      return `<span>${item}</span>`;
    }

    function renderBoard(poolToRender, clickable = true) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      poolToRender.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.dataset.index = index;
        div.innerHTML = getCardHTML(item);
        if (clickable) div.addEventListener('click', () => handleCardClick(div, item));
        board.appendChild(div);
      });
    }

    function setStatus(text) { document.getElementById('status-bar').innerText = text; }

    document.getElementById('btn-go-to-lobbies').addEventListener('click', async () => {
      forceFullscreen(); 
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) return alert('Bitte Namen eingeben!');
      
      myName = nameInput;
      if (myName.toLowerCase() === 'nate') { isAdmin = true; }

      if (selectedMode === 'custom') await saveUserCustomSelection(myName);
      myPool = await generatePool(selectedMode);
      
      switchView('view-lobby-list');
      loadLobbies();
    });

    async function loadLobbies() {
      const { data, error } = await supabaseClient.from('active_lobbies').select('*');
      const list = document.getElementById('active-lobbies-list');
      list.innerHTML = '';
      
      if (data && data.length > 0) {
        data.forEach(room => {
          const li = document.createElement('li');
          li.className = 'player-list-item';
          
          li.innerHTML = `
            <div class="lobby-info">
              <span class="lobby-title">${room.room_name}</span>
              <span class="lobby-host">Host: ${room.created_by}</span>
            </div>
          `;
          
          const btnGroup = document.createElement('div');
          
          const joinBtn = document.createElement('button');
          joinBtn.innerText = 'Beitreten';
          joinBtn.className = 'btn-basic';
          joinBtn.style.margin = '0';
          joinBtn.style.padding = '0.5rem 1.2rem';
          joinBtn.onclick = () => joinRoom(room.room_name, false);
          btnGroup.appendChild(joinBtn);

          if (isAdmin) {
             const delBtn = document.createElement('button');
             delBtn.innerText = 'X';
             delBtn.className = 'btn-danger';
             delBtn.style.marginLeft = '10px';
             delBtn.onclick = async () => {
               await supabaseClient.from('active_lobbies').delete().eq('room_name', room.room_name);
               loadLobbies();
             };
             btnGroup.appendChild(delBtn);
          }

          li.appendChild(btnGroup);
          list.appendChild(li);
        });
      } else {
        list.innerHTML = '<li style="color: var(--text-muted); font-size: 1rem; font-weight: 700; padding: 20px;">Keine offenen Spiele gefunden.</li>';
      }
    }

    document.getElementById('btn-create-room').addEventListener('click', async () => {
      const rName = document.getElementById('new-room-name').value.trim();
      if(!rName) return alert('Bitte gib deiner Lobby einen Namen!');

      const { error } = await supabaseClient.from('active_lobbies').insert({ room_name: rName, created_by: myName });
      if(error && error.code !== '23505') { 
         return alert("Fehler beim Erstellen: " + error.message);
      }

      joinRoom(rName, true);
    });

    function joinRoom(roomName, asHost) {
      currentRoom = roomName.replace(/[^a-zA-Z0-9-_]/g, '-'); 
      isHost = asHost; 
      players = [{ name: myName, pool: myPool }];
      
      document.getElementById('current-room-title').innerText = "Raum: " + roomName;
      
      if (channel) {
        pusher.unsubscribe(channel.name);
      }
      channel = pusher.subscribe('private-room-' + currentRoom);
      
      channel.bind('client-join', (data) => {
        if (!players.find(p => p.name === data.name)) {
          players.push(data);
          updateLobbyUI();
        }
        if (isHost || isAdmin) channel.trigger('client-sync-lobby', { players: players });
      });

      channel.bind('client-sync-lobby', (data) => {
        if(!isHost) players = data.players;
        updateLobbyUI();
      });

      channel.bind('client-start-selection', (data) => startSelectionPhase(data.assignments));
      channel.bind('client-target-selected', (data) => processSelection(data));
      channel.bind('client-winner', (data) => showWinScreen(data.name));
      channel.bind('client-restart', () => resetGameToLobby());

      switchView('view-lobby');
      updateLobbyUI();
      
      channel.bind('pusher:subscription_succeeded', () => {
        channel.trigger('client-join', { name: myName, pool: myPool });
      });
    }

    function updateLobbyUI() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = 'player-list-item';
        li.innerText = p.name + (p.name === myName ? " (Du)" : "");
        list.appendChild(li);
      });
      
      document.getElementById('lobby-status').innerText = `Spieler in Lobby: ${players.length}`;
      
      const canStart = (isHost || isAdmin) && players.length >= 2;
      document.getElementById('btn-start-multiplayer').style.display = canStart ? 'block' : 'none';
    }

    document.getElementById('btn-start-multiplayer').addEventListener('click', () => {
      forceFullscreen();
      let assignments = [];
      let shuffledPlayers = shuffleArray([...players]);
      
      for (let i = 0; i < shuffledPlayers.length; i++) {
        let picker = shuffledPlayers[i];
        let guesser = shuffledPlayers[(i + 1) % shuffledPlayers.length];
        assignments.push({ pickerName: picker.name, guesserName: guesser.name, guesserPool: guesser.pool });
      }
      
      channel.trigger('client-start-selection', { assignments });
      startSelectionPhase(assignments);
    });

    function startSelectionPhase(assignments) {
      myAssignment = assignments.find(a => a.pickerName === myName);
      gamePhase = 'selecting';
      selectionsReady = 0;
      
      switchView('view-game');
      setStatus(`Wähle die Karte für: ${myAssignment.guesserName}`);
      renderBoard(myAssignment.guesserPool);
    }

    function handleCardClick(cardElement, item) {
      if (gamePhase === 'selecting') {
        document.querySelectorAll('.card').forEach(c => c.style.pointerEvents = 'none');
        cardElement.classList.add('selected-target');
        setStatus('Warte auf die anderen Spieler...');
        
        channel.trigger('client-target-selected', { pickerName: myName, guesserName: myAssignment.guesserName, targetItem: item });
        processSelection({ pickerName: myName, guesserName: myAssignment.guesserName, targetItem: item });
        
      } else if (gamePhase === 'playing') {
        cardElement.classList.toggle('eliminated');
        checkWinCondition();
      }
    }

    function processSelection(data) {
      selectionsReady++;
      if (data.guesserName === myName) cardIGuess = data.targetItem;
      if (data.pickerName === myName) cardToDefend = data.targetItem;
      if (selectionsReady === players.length) startGamePhase();
    }

    function startGamePhase() {
      gamePhase = 'playing';
      setStatus('Finde heraus, wer du bist!');
      renderBoard(myPool);
      
      document.getElementById('opponent-target-display').style.display = 'flex';
      document.getElementById('target-player-name').innerText = `${myAssignment.guesserName} sucht:`;
      
      document.getElementById('opponent-target-content').innerHTML = getCardHTML(cardToDefend);
    }

    function checkWinCondition() {
      const remainingCards = document.querySelectorAll('.card:not(.eliminated)');
      if (remainingCards.length === 1) {
        const remainingIndex = parseInt(remainingCards[0].dataset.index);
        if (myPool[remainingIndex] === cardIGuess) {
          channel.trigger('client-winner', { name: myName });
          showWinScreen(myName);
        }
      }
    }

    function showWinScreen(winnerName) {
      document.getElementById('win-screen').style.display = 'flex';
      document.getElementById('winner-name-display').innerText = `${winnerName} hat gewonnen!`;
      if (isHost || isAdmin) document.getElementById('btn-restart').style.display = 'block';
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      channel.trigger('client-restart', {});
      resetGameToLobby();
    });

    async function resetGameToLobby() {
      document.getElementById('win-screen').style.display = 'none';
      document.getElementById('btn-restart').style.display = 'none';
      document.getElementById('opponent-target-display').style.display = 'none';
      document.getElementById('board').innerHTML = '';
      
      cardIGuess = null; cardToDefend = null; myAssignment = null;
      selectionsReady = 0; gamePhase = 'waiting';
      
      myPool = await generatePool(selectedMode);
      let me = players.find(p => p.name === myName);
      if(me) me.pool = myPool;
      
      switchView('view-lobby');
      updateLobbyUI();
      if (isHost || isAdmin) channel.trigger('client-sync-lobby', { players: players });
    }
  </script>
</body>
</html>
