<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wer ist es?</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #181a24;
      --accent-basic: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --accent-custom: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --accent-green: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      --border-color: #2d3748;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
    }

    #btn-fullscreen {
      position: absolute;
      top: 0px;
      right: 0px;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #a0aec0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
      margin-top: 3rem;
    }

    h2, h3 { color: #e2e8f0; }

    button {
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin: 0.5rem;
    }

    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-basic { background: var(--accent-basic); }
    .btn-custom { background: var(--accent-custom); }
    .btn-action { background: var(--accent-green); width: 100%; max-width: 320px; margin: 1.5rem 0; }

    input {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: white;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border-radius: 10px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #667eea; }

    .view { display: none; animation: fadeIn 0.3s ease-in-out; }
    .active-view { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #view-mode-select {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 500px;
      margin: 0 auto;
    }
    #view-mode-select button { width: 100%; max-width: 325px; }

    .setup-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin: 1rem auto;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      aspect-ratio: 4 / 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .card img { width: 100%; height: 80%; object-fit: cover; border-bottom: 2px solid var(--border-color); }
    .card span { height: 20%; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-weight: 600; font-size: 0.85rem; word-break: break-word; text-align: center; color: var(--text-main); }
    
    .card:hover { border-color: #667eea; transform: translateY(-2px); }
    
    .card.custom-unselected { opacity: 0.3; filter: grayscale(80%); }

    .eliminated { opacity: 0.25; filter: grayscale(100%); transform: scale(0.96); border-color: #1a1a1a; }
    .selected-target { border-color: #38ef7d !important; box-shadow: 0 0 20px rgba(56, 239, 125, 0.4); pointer-events: none; }

    #status-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 1.05rem;
    }

    #opponent-target-display {
      display: none;
      background: var(--card-bg);
      border: 2px solid #38ef7d;
      border-radius: 12px;
      padding: 10px;
      margin: 0 auto 20px auto;
      max-width: 160px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    #opponent-target-display img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border-bottom: 2px solid var(--border-color); }
    #opponent-target-display span { font-weight: 600; font-size: 0.9rem; display: block; margin-top: 5px; }

    #win-screen {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 16, 21, 0.95);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #win-screen h1 { font-size: 4rem; color: #38ef7d; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
    #win-screen h2 { font-size: 2rem; color: white; margin-bottom: 1.5rem; }
    #win-screen button { background: var(--accent-custom); font-size: 1.2rem; padding: 1rem 2.5rem; }
    
    .player-list-item { background: #2d3748; margin: 5px auto; padding: 10px; border-radius: 8px; max-width: 300px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <button id="btn-fullscreen">Vollbild</button>
    <h1>Wer ist es?</h1>

    <div id="view-mode-select" class="view active-view">
      <h2 style="margin-top:0;">Wähle Modus</h2>
      <button class="btn-basic" onclick="selectMode('basic')">Basic</button>
      <button class="btn-custom" onclick="selectMode('custom')">Custom</button>
    </div>

    <div id="view-setup" class="view">
      <div class="setup-card">
        <h2 id="setup-title" style="margin-top:0;">Dein Profil</h2>
        <input type="text" id="player-name" placeholder="Dein Name" autocomplete="off" /><br>
        
        <div id="custom-selection-container" style="display:none; margin-top: 1.5rem;">
          <h3>Wähle die Personen aus, die du kennst:</h3>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Klicke auf die Karten zum Auswählen.</p>
          <div class="grid" id="custom-grid"></div>
        </div>

        <button class="btn-action" id="btn-join-lobby">Lobby beitreten</button>
      </div>
    </div>

    <div id="view-lobby" class="view">
      <div class="setup-card">
        <h2 style="margin-top:0;">Lobby</h2>
        <div id="lobby-status" style="margin-bottom: 15px; color: var(--text-muted);">Verbinde...</div>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
        <button class="btn-action" id="btn-start-multiplayer" style="display:none;">Spiel starten</button>
      </div>
    </div>

    <div id="view-game" class="view">
      <div id="status-bar">Warte auf Zuweisung...</div>
      
      <div id="opponent-target-display">
        <p style="margin: 0 0 5px 0; color: #38ef7d; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">Sucht nach:</p>
        <div id="opponent-target-content"></div>
      </div>

      <div class="grid" id="board"></div>
    </div>
  </div>

  <div id="win-screen">
    <h1>Gewonnen!</h1>
    <h2 id="winner-name-display"></h2>
    <button id="btn-restart" style="display:none;">Neue Runde (Nur Host)</button>
  </div>

  <script>
    const pusher = new Pusher('3df7da082bcfbaaacad9', { cluster: 'eu', authEndpoint: '/api/auth' });
    const channel = pusher.subscribe('private-game-room');
    
    const SUPABASE_URL = 'https://vqqtiskjqyemzhelmqki.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxcXRpc2tqcXllbXpoZWxtcWkiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NjA3OTI2NCwiZXhwIjoyMTAxNjU1MjY0f.-bofHdro5SOiXVioD4eJkSl69_qiMj2ExCCnhb0TKSQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = '';
    let selectedMode = ''; 
    let myPool = [];
    let allBasicFiles = [];

    // Multiplayer State
    let players = [];
    let isHost = false;
    let myAssignment = null; 
    let cardIGuess = null;     
    let cardToDefend = null;   
    let selectionsReady = 0;
    let gamePhase = 'waiting';

    fetch('/api/getImages')
      .then(res => res.json())
      .then(files => {
        if (files.error) return console.error(files.error);
        allBasicFiles = files.map(file => `Bilder/${file}`);
      })
      .catch(err => console.error("Fehler:", err));

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
      document.getElementById(viewId).classList.add('active-view');
    }

    window.selectMode = function(mode) {
      selectedMode = mode;
      const customContainer = document.getElementById('custom-selection-container');
      
      if (mode === 'custom') {
        customContainer.style.display = 'block';
        document.getElementById('setup-title').innerText = 'Custom Modus';
      } else {
        customContainer.style.display = 'none';
        document.getElementById('setup-title').innerText = 'Basic Modus';
      }
      switchView('view-setup');
    };

    document.getElementById('player-name').addEventListener('input', (e) => {
      const name = e.target.value.trim();
      if (selectedMode === 'custom' && name) {
        loadUserCustomSelection(name);
      }
    });

    async function loadUserCustomSelection(name) {
      const { data } = await supabaseClient
        .from('user_selections')
        .select('selected_images')
        .eq('player_name', name)
        .single();

      const selectedSet = data ? data.selected_images : [...allBasicFiles];
      const grid = document.getElementById('custom-grid');
      grid.innerHTML = '';

      allBasicFiles.forEach(file => {
        const div = document.createElement('div');
        div.className = 'card';
        if (!selectedSet.includes(file)) div.classList.add('custom-unselected');

        div.innerHTML = getCardHTML(file);
        div.addEventListener('click', () => {
          div.classList.toggle('custom-unselected');
        });
        grid.appendChild(div);
      });
    }

    async function saveUserCustomSelection(name) {
      const gridCards = document.querySelectorAll('#custom-grid .card');
      const selectedFiles = [];
      gridCards.forEach((card, index) => {
        if (!card.classList.contains('custom-unselected')) {
          selectedFiles.push(allBasicFiles[index]);
        }
      });
      await supabaseClient.from('user_selections').upsert({ player_name: name, selected_images: selectedFiles });
    }

    function shuffleArray(array) {
      let curId = array.length;
      while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = array[curId];
        array[curId] = array[randId];
        array[randId] = tmp;
      }
      return array;
    }

    async function generatePool(mode) {
      if (mode === 'basic') {
        return shuffleArray([...allBasicFiles]).slice(0, 20);
      } else {
        const { data } = await supabaseClient
          .from('user_selections')
          .select('selected_images')
          .eq('player_name', myName)
          .single();

        let userSelected = data ? data.selected_images : [...allBasicFiles];
        shuffleArray(userSelected);

        if (userSelected.length >= 20) {
          return userSelected.slice(0, 20);
        } else {
          const remaining = allBasicFiles.filter(f => !userSelected.includes(f));
          shuffleArray(remaining);
          const needed = 20 - userSelected.length;
          return [...userSelected, ...remaining.slice(0, needed)];
        }
      }
    }

    function getCardHTML(item) {
      if (item.toLowerCase().match(/\.(jpg|jpeg|png)$/)) {
        const name = item.split('/').pop().split('.')[0];
        return `<img src="${item}" alt="${name}"><span>${name}</span>`;
      }
      return `<span>${item}</span>`;
    }

    function renderBoard(poolToRender, clickable = true) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      
      poolToRender.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.dataset.index = index;
        div.innerHTML = getCardHTML(item);

        if (clickable) {
          div.addEventListener('click', () => handleCardClick(div, index, item));
        }
        board.appendChild(div);
      });
    }

    function setStatus(text) { document.getElementById('status-bar').innerText = text; }

    document.getElementById('btn-join-lobby').addEventListener('click', async () => {
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) return alert('Bitte Namen eingeben');
      if (allBasicFiles.length < 20) return alert('Mindestens 20 Bilder in der Datenbank nötig!');

      myName = nameInput;
      if (selectedMode === 'custom') await saveUserCustomSelection(myName);
      myPool = await generatePool(selectedMode);
      
      players = [{ name: myName, pool: myPool }];
      isHost = true; 
      
      switchView('view-lobby');
      updateLobbyUI();
      
      channel.trigger('client-join', { name: myName, pool: myPool });
      
      setTimeout(() => {
        if (isHost && players.length >= 2) {
            document.getElementById('btn-start-multiplayer').style.display = 'block';
        }
      }, 1500);
    });

    function updateLobbyUI() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = 'player-list-item';
        li.innerText = p.name + (p.name === myName ? " (Du)" : "");
        list.appendChild(li);
      });
      
      document.getElementById('lobby-status').innerText = `Spieler in Lobby: ${players.length}`;
      
      if (isHost && players.length >= 2) {
         document.getElementById('btn-start-multiplayer').style.display = 'block';
      } else {
         document.getElementById('btn-start-multiplayer').style.display = 'none';
      }
    }

    channel.bind('client-join', (data) => {
      if (!players.find(p => p.name === data.name)) {
        players.push(data);
        updateLobbyUI();
      }
      if (isHost) {
        channel.trigger('client-sync-lobby', { players: players });
      }
    });

    channel.bind('client-sync-lobby', (data) => {
      isHost = false; 
      players = data.players;
      updateLobbyUI();
    });

    document.getElementById('btn-start-multiplayer').addEventListener('click', () => {
      if (players.length < 2) return alert('Mindestens 2 Spieler erforderlich.');
      
      let assignments = [];
      let shuffledPlayers = shuffleArray([...players]);
      
      for (let i = 0; i < shuffledPlayers.length; i++) {
        let picker = shuffledPlayers[i];
        let guesser = shuffledPlayers[(i + 1) % shuffledPlayers.length];
        
        assignments.push({
          pickerName: picker.name,
          guesserName: guesser.name,
          guesserPool: guesser.pool
        });
      }
      
      channel.trigger('client-start-selection', { assignments });
      startSelectionPhase(assignments);
    });

    channel.bind('client-start-selection', (data) => {
      startSelectionPhase(data.assignments);
    });

    function startSelectionPhase(assignments) {
      myAssignment = assignments.find(a => a.pickerName === myName);
      gamePhase = 'selecting';
      selectionsReady = 0;
      
      switchView('view-game');
      setStatus(`Wähle eine Karte aus, die ${myAssignment.guesserName} erraten muss!`);
      renderBoard(myAssignment.guesserPool);
    }

    function handleCardClick(cardElement, index, item) {
      if (gamePhase === 'selecting') {
        document.querySelectorAll('.card').forEach(c => c.style.pointerEvents = 'none');
        cardElement.classList.add('selected-target');
        setStatus('Warte, bis alle Spieler gewählt haben...');
        
        channel.trigger('client-target-selected', { 
            pickerName: myName,
            guesserName: myAssignment.guesserName, 
            targetItem: item 
        });
        
        processSelection({ pickerName: myName, guesserName: myAssignment.guesserName, targetItem: item });
        
      } else if (gamePhase === 'playing') {
        if (!cardElement.classList.contains('eliminated')) {
          cardElement.classList.add('eliminated');
          checkWinCondition();
        } else {
          cardElement.classList.remove('eliminated'); 
        }
      }
    }

    channel.bind('client-target-selected', (data) => {
      processSelection(data);
    });

    function processSelection(data) {
      selectionsReady++;
      
      if (data.guesserName === myName) {
        cardIGuess = data.targetItem;
      }
      
      if (data.pickerName === myName) {
        cardToDefend = data.targetItem;
      }
      
      if (selectionsReady === players.length) {
        startGamePhase();
      }
    }

    function startGamePhase() {
      gamePhase = 'playing';
      setStatus('Das Spiel beginnt! Finde heraus, wer du bist.');
      
      renderBoard(myPool);
      
      document.getElementById('opponent-target-display').style.display = 'block';
      document.querySelector('#opponent-target-display p').innerText = `${myAssignment.guesserName} sucht nach:`;
      document.getElementById('opponent-target-content').innerHTML = getCardHTML(cardToDefend);
    }

    function checkWinCondition() {
      const remainingCards = document.querySelectorAll('.card:not(.eliminated)');
      if (remainingCards.length === 1) {
        const remainingIndex = parseInt(remainingCards[0].dataset.index);
        const remainingItem = myPool[remainingIndex];
        
        if (remainingItem === cardIGuess) {
          channel.trigger('client-winner', { name: myName });
          showWinScreen(myName);
        }
      }
    }

    channel.bind('client-winner', (data) => {
      showWinScreen(data.name);
    });

    function showWinScreen(winnerName) {
      document.getElementById('win-screen').style.display = 'flex';
      document.getElementById('winner-name-display').innerText = `${winnerName} hat gewonnen!`;
      
      if (isHost) {
        document.getElementById('btn-restart').style.display = 'block';
      }
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      channel.trigger('client-restart', {});
      resetGameToLobby();
    });

    channel.bind('client-restart', () => {
      resetGameToLobby();
    });

    async function resetGameToLobby() {
      document.getElementById('win-screen').style.display = 'none';
      document.getElementById('btn-restart').style.display = 'none';
      
      cardIGuess = null;
      cardToDefend = null;
      myAssignment = null;
      selectionsReady = 0;
      gamePhase = 'waiting';
      
      document.getElementById('opponent-target-display').style.display = 'none';
      document.getElementById('board').innerHTML = '';
      
      myPool = await generatePool(selectedMode);
      
      let me = players.find(p => p.name === myName);
      if(me) me.pool = myPool;
      
      switchView('view-lobby');
      updateLobbyUI();
      
      if (isHost) {
        channel.trigger('client-sync-lobby', { players: players });
      }
    }

    // FULLSCREEN LOGIK
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(err => console.log("Ausrichtungssperre blockiert:", err));
          }
        }).catch(err => {
          console.log(`Fehler beim Vollbild: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });
  </script>
</body>
</html>
