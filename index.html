<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Wer ist es?</title>
  <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #181a24;
      --accent-basic: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --accent-custom: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --accent-green: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      --accent-danger: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      --border-color: #2d3748;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
      text-align: center;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
    }

    .hide-in-game { display: block; }

    #btn-fullscreen {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      z-index: 100;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #a0aec0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 1.5rem 0 1rem 0;
    }

    h2, h3 { color: #e2e8f0; }

    button {
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin: 0.5rem;
    }

    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-basic { background: var(--accent-basic); }
    .btn-custom { background: var(--accent-custom); }
    .btn-action { background: var(--accent-green); width: 100%; max-width: 320px; margin: 1rem 0; }
    .btn-danger { background: var(--accent-danger); font-size: 0.9rem; padding: 0.5rem 1rem; margin: 0;}

    input {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      color: white;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border-radius: 10px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 1rem;
      outline: none;
      box-sizing: border-box;
    }

    .view { display: none; animation: fadeIn 0.3s ease-in-out; flex: 1; flex-direction: column; overflow-y: auto; padding: 10px; min-height: 0; }
    .active-view { display: flex; }
    #view-game { padding: 0; overflow: hidden; } 

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .setup-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      margin: 0 auto;
      width: 90%;
      max-width: 500px;
    }

    #custom-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-top: 1rem; }

    #game-header {
      display: flex; align-items: center; justify-content: space-between;
      height: 15vh; background: var(--card-bg); border-bottom: 1px solid var(--border-color);
      padding: 0 10px; box-sizing: border-box;
    }

    #status-bar { font-size: 0.85rem; font-weight: bold; color: #a0aec0; text-align: left; flex: 1; }

    #opponent-target-display {
      display: none; align-items: center; gap: 10px; background: rgba(56, 239, 125, 0.1);
      border: 1px solid #38ef7d; border-radius: 8px; padding: 4px 10px; height: 80%;
    }
    
    #opponent-target-display p { margin: 0; color: #38ef7d; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
    #opponent-target-content { display: flex; align-items: center; gap: 8px; }
    
    #opponent-target-content img { 
      height: 10vh; aspect-ratio: 4 / 5; object-fit: cover; 
      border-radius: 4px; border: 1px solid var(--border-color);
    }
    
    #opponent-target-content span { font-size: 0.8rem; font-weight: bold; }

    /* CORE FIX: Spielfeld zentriert Elemente */
    #board { flex: 1; display: grid; gap: 4px; padding: 4px; background: #000; box-sizing: border-box; min-height: 0; place-items: center; }

    /* CORE FIX: Basis-Karte ohne feste Höhe/Breite, die Medien-Queries übernehmen die Kontrolle */
    .card {
      background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 8px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
      justify-content: space-between; overflow: hidden; position: relative;
    }
    .card img { width: 100%; height: 75%; object-fit: cover; }
    .card span { 
      height: 25%; width: 100%; display: flex; align-items: center; justify-content: center; 
      font-weight: 600; font-size: 0.75rem; color: var(--text-main); box-sizing: border-box; 
      padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
    }

    /* CORE FIX: Hochformat (Handy) - Karte füllt Breite, Höhe ergibt sich aus 4:5 */
    @media (orientation: portrait) { 
      #board { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, minmax(0, 1fr)); } 
      .card { width: 100%; height: auto; max-height: 100%; aspect-ratio: 4 / 5; }
    }
    /* CORE FIX: Querformat (PC/Landscape) - Karte füllt Höhe, Breite ergibt sich aus 4:5 */
    @media (orientation: landscape) { 
      #board { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, minmax(0, 1fr)); } 
      .card { height: 100%; width: auto; max-width: 100%; aspect-ratio: 4 / 5; }
    }
    
    .card.custom-unselected { opacity: 0.3; filter: grayscale(80%); }
    .card.custom-selected { border-color: #38ef7d; }
    .card.custom-selected::after {
      content: '✔'; position: absolute; top: 5px; right: 5px; background: #38ef7d; color: #0f1015;
      border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center;
      justify-content: center; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .eliminated { opacity: 0.15; filter: grayscale(100%); border-color: #000; }
    .selected-target { border-color: #38ef7d !important; box-shadow: 0 0 10px rgba(56, 239, 125, 0.5); pointer-events: none; }

    #win-screen {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 16, 21, 0.95); z-index: 999; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #win-screen h1 { font-size: 3rem; color: #38ef7d; margin-bottom: 0.5rem; }
    #win-screen h2 { font-size: 1.5rem; color: white; margin-bottom: 1.5rem; }
    #win-screen button { background: var(--accent-custom); }
    
    .player-list-item { background: #2d3748; margin: 5px auto; padding: 10px; border-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
    .lobby-info { display: flex; flex-direction: column; align-items: flex-start; }
    .lobby-title { font-size: 1.1rem; color: white; }
    .lobby-host { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; }

    /* PC Optimierung */
    @media (min-width: 800px) {
      body { display: flex; align-items: center; justify-content: center; background-color: #050505; }
      .container {
        width: 95vw; height: 90vh; max-width: 1100px; max-height: 800px;
        border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        border: 1px solid var(--border-color); position: relative;
      }
      .card span { font-size: 1.1rem; }
      #board { gap: 12px; padding: 12px; border-radius: 0 0 16px 16px; }
      #game-header { height: 130px; border-radius: 16px 16px 0 0; }
      #opponent-target-display p { font-size: 0.9rem; }
      #opponent-target-content span { font-size: 1.2rem; }
      #opponent-target-content img { height: 100px; width: auto; }
    }
  </style>
</head>
<body>
  <button id="btn-fullscreen" class="hide-in-game">Vollbild</button>
  
  <div class="container">
    <h1 class="hide-in-game" id="main-title">Wer ist es?</h1>

    <!-- 1. Modus Auswahl -->
    <div id="view-mode-select" class="view active-view">
      <div class="setup-card">
        <h2 style="margin-top:0;">Wähle Modus</h2>
        <button class="btn-basic" onclick="selectMode('basic')" style="width: 100%;">Basic</button>
        <button class="btn-custom" onclick="selectMode('custom')" style="width: 100%;">Custom</button>
      </div>
    </div>

    <!-- 2. Setup (Name & Bilder) -->
    <div id="view-setup" class="view">
      <div class="setup-card">
        <h2 id="setup-title" style="margin-top:0;">Dein Profil</h2>
        <input type="text" id="player-name" placeholder="Dein Name" autocomplete="off" />
        
        <div id="custom-selection-container" style="display:none; margin-top: 1rem;">
          <p style="color: var(--text-muted); font-size: 0.8rem; margin:0;">Wähle bekannte Personen:</p>
          <div id="custom-grid"></div>
        </div>

        <button class="btn-action" id="btn-go-to-lobbies">Weiter zur Lobby-Auswahl</button>
      </div>
    </div>

    <!-- 3. NEU: Lobby Liste -->
    <div id="view-lobby-list" class="view">
      <div class="setup-card" style="max-width: 600px;">
        <h2 style="margin-top:0;">Lobbys</h2>
        
        <!-- Lobby erstellen -->
        <div style="margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
          <input type="text" id="new-room-name" placeholder="Name für neue Lobby" style="margin-bottom: 10px;" />
          <button class="btn-basic" id="btn-create-room" style="width: 100%; margin: 0;">Lobby erstellen</button>
        </div>
        
        <!-- Vorhandene Lobbys -->
        <h3 style="text-align: left; margin-top: 0;">Offene Spiele</h3>
        <ul id="active-lobbies-list" style="list-style: none; padding: 0; margin: 0;"></ul>
      </div>
    </div>

    <!-- 4. Wartebereich im Raum -->
    <div id="view-lobby" class="view">
      <div class="setup-card">
        <h2 id="current-room-title" style="margin-top:0;">Raum</h2>
        <div id="lobby-status" style="margin-bottom: 10px; color: var(--text-muted);">Verbinde...</div>
        <ul id="player-list" style="list-style: none; padding: 0;"></ul>
        <button class="btn-action" id="btn-start-multiplayer" style="display:none;">Spiel starten</button>
      </div>
    </div>

    <!-- 5. Das Spiel -->
    <div id="view-game" class="view">
      <div id="game-header">
        <div id="status-bar">Warte auf Zuweisung...</div>
        <div id="opponent-target-display">
          <div><p id="target-player-name">Gegner</p></div>
          <div id="opponent-target-content"></div>
        </div>
      </div>
      <div id="board"></div>
    </div>
  </div>

  <div id="win-screen">
    <h1>Gewonnen!</h1>
    <h2 id="winner-name-display"></h2>
    <button id="btn-restart" style="display:none;">Zurück zur Lobby</button>
  </div>

  <script>
    const pusher = new Pusher('3df7da082bcfbaaacad9', { cluster: 'eu', authEndpoint: '/api/auth' });
    let channel = null; 
    
    const SUPABASE_URL = 'https://vqqtiskjqyemzhelmqki.supabase.co';
    // TRAGE HIER DEINEN RICHTIGEN KEY EIN:
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxcXRpc2tqcXllbXpoZWxtcWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzkyNjQsImV4cCI6MjEwMTY1NTI2NH0.-bofHdro5SOiXVioD4eJkSl69_qiMj2ExCCnhb0TKSQ'; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let myName = '';
    let isAdmin = false; 
    let currentRoom = '';
    let selectedMode = ''; 
    let myPool = [];
    let allBasicFiles = [];

    let players = [];
    let isHost = false;
    let myAssignment = null; 
    let cardIGuess = null;     
    let cardToDefend = null;   
    let selectionsReady = 0;
    let gamePhase = 'waiting';

    function forceFullscreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().then(() => {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {}); 
              }
            }).catch(() => {});
          } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
        }
      } catch (e) {
        console.log("Vollbild auf diesem Gerät nicht unterstützt.");
      }
    }

    document.getElementById('btn-fullscreen').addEventListener('click', forceFullscreen);

    function toggleGameUI(inGame) {
      const elementsToHide = document.querySelectorAll('.hide-in-game');
      elementsToHide.forEach(el => el.style.display = inGame ? 'none' : 'block');
    }

    fetch('/api/getImages')
      .then(res => res.json())
      .then(files => {
        if (files.error) return;
        allBasicFiles = files.map(file => `Bilder/${file}`);
      });

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
      document.getElementById(viewId).classList.add('active-view');
      toggleGameUI(viewId === 'view-game');
    }

    window.selectMode = function(mode) {
      selectedMode = mode;
      document.getElementById('custom-selection-container').style.display = mode === 'custom' ? 'block' : 'none';
      switchView('view-setup');
    };

    document.getElementById('player-name').addEventListener('change', (e) => {
      const name = e.target.value.trim();
      if (selectedMode === 'custom' && name) {
        loadUserCustomSelection(name);
      }
    });

    async function loadUserCustomSelection(name) {
      const { data, error } = await supabaseClient.from('user_selections').select('selected_images').eq('player_name', name).single();
      const selectedSet = data ? data.selected_images : [...allBasicFiles];
      const grid = document.getElementById('custom-grid');
      grid.innerHTML = '';

      allBasicFiles.forEach(file => {
        const div = document.createElement('div');
        div.className = 'card';
        if (selectedSet.includes(file)) div.classList.add('custom-selected');
        else div.classList.add('custom-unselected');

        div.innerHTML = getCardHTML(file);
        div.addEventListener('click', () => {
          div.classList.toggle('custom-selected');
          div.classList.toggle('custom-unselected');
        });
        grid.appendChild(div);
      });
    }

    async function saveUserCustomSelection(name) {
      const gridCards = document.querySelectorAll('#custom-grid .card');
      const selectedFiles = [];
      gridCards.forEach((card, index) => {
        if (card.classList.contains('custom-selected')) selectedFiles.push(allBasicFiles[index]);
      });
      await supabaseClient.from('user_selections').upsert({ player_name: name, selected_images: selectedFiles });
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    async function generatePool(mode) {
      if (mode === 'basic') return shuffleArray([...allBasicFiles]).slice(0, 20);
      
      const { data } = await supabaseClient.from('user_selections').select('selected_images').eq('player_name', myName).single();
      let userSelected = data ? data.selected_images : [...allBasicFiles];
      shuffleArray(userSelected);

      if (userSelected.length >= 20) return userSelected.slice(0, 20);
      
      const remaining = allBasicFiles.filter(f => !userSelected.includes(f));
      shuffleArray(remaining);
      return [...userSelected, ...remaining.slice(0, 20 - userSelected.length)];
    }

    function getCardHTML(item) {
      if (item.toLowerCase().match(/\.(jpg|jpeg|png)$/)) {
        const name = item.split('/').pop().split('.')[0];
        return `<img src="${item}" alt="${name}"><span>${name}</span>`;
      }
      return `<span>${item}</span>`;
    }

    function renderBoard(poolToRender, clickable = true) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      poolToRender.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.dataset.index = index;
        div.innerHTML = getCardHTML(item);
        if (clickable) div.addEventListener('click', () => handleCardClick(div, item));
        board.appendChild(div);
      });
    }

    function setStatus(text) { document.getElementById('status-bar').innerText = text; }

    document.getElementById('btn-go-to-lobbies').addEventListener('click', async () => {
      forceFullscreen(); 
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) return alert('Bitte Namen eingeben');
      
      myName = nameInput;
      if (myName.toLowerCase() === 'nate') { isAdmin = true; }

      if (selectedMode === 'custom') await saveUserCustomSelection(myName);
      myPool = await generatePool(selectedMode);
      
      switchView('view-lobby-list');
      loadLobbies();
    });

    async function loadLobbies() {
      const { data, error } = await supabaseClient.from('active_lobbies').select('*');
      const list = document.getElementById('active-lobbies-list');
      list.innerHTML = '';
      
      if (data && data.length > 0) {
        data.forEach(room => {
          const li = document.createElement('li');
          li.className = 'player-list-item';
          
          li.innerHTML = `
            <div class="lobby-info">
              <span class="lobby-title">${room.room_name}</span>
              <span class="lobby-host">Host: ${room.created_by}</span>
            </div>
          `;
          
          const btnGroup = document.createElement('div');
          
          const joinBtn = document.createElement('button');
          joinBtn.innerText = 'Beitreten';
          joinBtn.className = 'btn-action';
          joinBtn.style.margin = '0';
          joinBtn.style.padding = '0.5rem 1rem';
          joinBtn.onclick = () => joinRoom(room.room_name, false);
          btnGroup.appendChild(joinBtn);

          if (isAdmin) {
             const delBtn = document.createElement('button');
             delBtn.innerText = 'X';
             delBtn.className = 'btn-danger';
             delBtn.style.marginLeft = '10px';
             delBtn.onclick = async () => {
               await supabaseClient.from('active_lobbies').delete().eq('room_name', room.room_name);
               loadLobbies();
             };
             btnGroup.appendChild(delBtn);
          }

          li.appendChild(btnGroup);
          list.appendChild(li);
        });
      } else {
        list.innerHTML = '<li style="color: gray; font-size: 0.9rem;">Keine aktiven Spiele. Erstelle ein neues!</li>';
      }
    }

    document.getElementById('btn-create-room').addEventListener('click', async () => {
      const rName = document.getElementById('new-room-name').value.trim();
      if(!rName) return alert('Bitte Raumnamen eingeben');

      const { error } = await supabaseClient.from('active_lobbies').insert({ room_name: rName, created_by: myName });
      if(error && error.code !== '23505') { 
         return alert("Fehler beim Erstellen der Lobby: " + error.message);
      }

      joinRoom(rName, true);
    });

    function joinRoom(roomName, asHost) {
      currentRoom = roomName.replace(/[^a-zA-Z0-9-_]/g, '-'); 
      isHost = asHost; 
      players = [{ name: myName, pool: myPool }];
      
      document.getElementById('current-room-title').innerText = "Raum: " + roomName;
      
      if (channel) {
        pusher.unsubscribe(channel.name);
      }
      channel = pusher.subscribe('private-room-' + currentRoom);
      
      channel.bind('client-join', (data) => {
        if (!players.find(p => p.name === data.name)) {
          players.push(data);
          updateLobbyUI();
        }
        if (isHost || isAdmin) channel.trigger('client-sync-lobby', { players: players });
      });

      channel.bind('client-sync-lobby', (data) => {
        if(!isHost) players = data.players;
        updateLobbyUI();
      });

      channel.bind('client-start-selection', (data) => startSelectionPhase(data.assignments));
      channel.bind('client-target-selected', (data) => processSelection(data));
      channel.bind('client-winner', (data) => showWinScreen(data.name));
      channel.bind('client-restart', () => resetGameToLobby());

      switchView('view-lobby');
      updateLobbyUI();
      
      channel.bind('pusher:subscription_succeeded', () => {
        channel.trigger('client-join', { name: myName, pool: myPool });
      });
    }

    function updateLobbyUI() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.className = 'player-list-item';
        li.innerText = p.name + (p.name === myName ? " (Du)" : "");
        list.appendChild(li);
      });
      
      document.getElementById('lobby-status').innerText = `Spieler in Lobby: ${players.length}`;
      
      const canStart = (isHost || isAdmin) && players.length >= 2;
      document.getElementById('btn-start-multiplayer').style.display = canStart ? 'block' : 'none';
    }

    document.getElementById('btn-start-multiplayer').addEventListener('click', () => {
      forceFullscreen();
      let assignments = [];
      let shuffledPlayers = shuffleArray([...players]);
      
      for (let i = 0; i < shuffledPlayers.length; i++) {
        let picker = shuffledPlayers[i];
        let guesser = shuffledPlayers[(i + 1) % shuffledPlayers.length];
        assignments.push({ pickerName: picker.name, guesserName: guesser.name, guesserPool: guesser.pool });
      }
      
      channel.trigger('client-start-selection', { assignments });
      startSelectionPhase(assignments);
    });

    function startSelectionPhase(assignments) {
      myAssignment = assignments.find(a => a.pickerName === myName);
      gamePhase = 'selecting';
      selectionsReady = 0;
      
      switchView('view-game');
      setStatus(`Wähle für: ${myAssignment.guesserName}`);
      renderBoard(myAssignment.guesserPool);
    }

    function handleCardClick(cardElement, item) {
      if (gamePhase === 'selecting') {
        document.querySelectorAll('.card').forEach(c => c.style.pointerEvents = 'none');
        cardElement.classList.add('selected-target');
        setStatus('Warte auf andere...');
        
        channel.trigger('client-target-selected', { pickerName: myName, guesserName: myAssignment.guesserName, targetItem: item });
        processSelection({ pickerName: myName, guesserName: myAssignment.guesserName, targetItem: item });
        
      } else if (gamePhase === 'playing') {
        cardElement.classList.toggle('eliminated');
        checkWinCondition();
      }
    }

    function processSelection(data) {
      selectionsReady++;
      if (data.guesserName === myName) cardIGuess = data.targetItem;
      if (data.pickerName === myName) cardToDefend = data.targetItem;
      if (selectionsReady === players.length) startGamePhase();
    }

    function startGamePhase() {
      gamePhase = 'playing';
      setStatus('Wer bist du?');
      renderBoard(myPool);
      
      document.getElementById('opponent-target-display').style.display = 'flex';
      document.getElementById('target-player-name').innerText = `${myAssignment.guesserName} sucht:`;
      
      const name = cardToDefend.split('/').pop().split('.')[0];
      document.getElementById('opponent-target-content').innerHTML = `<img src="${cardToDefend}"><span>${name}</span>`;
    }

    function checkWinCondition() {
      const remainingCards = document.querySelectorAll('.card:not(.eliminated)');
      if (remainingCards.length === 1) {
        const remainingIndex = parseInt(remainingCards[0].dataset.index);
        if (myPool[remainingIndex] === cardIGuess) {
          channel.trigger('client-winner', { name: myName });
          showWinScreen(myName);
        }
      }
    }

    function showWinScreen(winnerName) {
      document.getElementById('win-screen').style.display = 'flex';
      document.getElementById('winner-name-display').innerText = `${winnerName} hat gewonnen!`;
      if (isHost || isAdmin) document.getElementById('btn-restart').style.display = 'block';
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      channel.trigger('client-restart', {});
      resetGameToLobby();
    });

    async function resetGameToLobby() {
      document.getElementById('win-screen').style.display = 'none';
      document.getElementById('btn-restart').style.display = 'none';
      document.getElementById('opponent-target-display').style.display = 'none';
      document.getElementById('board').innerHTML = '';
      
      cardIGuess = null; cardToDefend = null; myAssignment = null;
      selectionsReady = 0; gamePhase = 'waiting';
      
      myPool = await generatePool(selectedMode);
      let me = players.find(p => p.name === myName);
      if(me) me.pool = myPool;
      
      switchView('view-lobby');
      updateLobbyUI();
      if (isHost || isAdmin) channel.trigger('client-sync-lobby', { players: players });
    }
  </script>
</body>
</html>
